<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Authentication</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="auth-container">
        <div class="auth-login">
            <h1>Sign in</h1>
            <div class="sosial-icons">
                <img src="image/Facebook_icon.png" class="social-icon">
                <img src="images/Google_icon.png"  class="social-icon">
                <img src="images/Twitter_icon.png" class="social-icon">
            </div>
            <h4>or use your account</h4>
            <input type="text" placeholder="Login">
            <input type="password" placeholder="Password">
            <h4 class="forgot-password">forgot your password?</h4>
            <button class="auth-btn">Sign in</button>
        </div>
        <div class="auth-register">
            <h1>Create Account</h1>
            <h4>or use yout email for regestration</h4>
            <input type="text" placeholder="Name">
            <input type="email" placeholder="Email">
            <input type="password" placeholder="Password">
            <button class="auth-btn">Sign up</button>
        </div>
    </div>
</body>
</html>
