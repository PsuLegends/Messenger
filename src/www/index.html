<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Authentication</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container" id="container">
        <!-- Форма регистрации -->
        <div class="form-container sign-up-container">
            <!-- ИЗМЕНЕНИЕ: Добавили id="registerForm" -->
            <form id="registerForm">
                <h1>Create Account</h1>
                <div class="social-container">
                    <a href="#" class="social"><img src="image/Facebook_icon.png" alt="Facebook"></a>
                    <a href="#" class="social"><img src="image/Google_icon.png" alt="Google"></a>
                    <a href="#" class="social"><img src="image/VK.png" alt="VK"></a>
                </div>
                <span>or use your email for registration</span>
                <!-- ИЗМЕНЕНИЕ: Добавили id полям ввода -->
                <input type="text" id="registerName" placeholder="Name" required />
                <input type="email" id="registerEmail" placeholder="Email" required />
                <input type="password" id="registerPassword" placeholder="Password" required />
                <!-- ИЗМЕНЕНИЕ: Добавили type="submit", чтобы форма отправлялась -->
                <button type="submit">Sign Up</button>
            </form>
        </div>

        <!-- Форма входа -->
        <div class="form-container sign-in-container">
            <!-- ИЗМЕНЕНИЕ: Добавили id="loginForm" -->
            <form id="loginForm">
                <h1>Sign In</h1>
                <div class="social-container">
                    <a href="#" class="social"><img src="image/Facebook_icon.png" alt="Facebook"></a>
                    <a href="#" class="social"><img src="image/Google_icon.png" alt="Google"></a>
                    <a href="#" class="social"><img src="image/VK.png" alt="VK"></a>
                </div>
                <span>or use your account</span>
                <!-- ИЗМЕНЕНИЕ: Добавили id полям ввода -->
                <input type="email" id="loginEmail" placeholder="Email" required />
                <input type="password" id="loginPassword" placeholder="Password" required />
                <a href="#">forgot your password?</a>
                <!-- ИЗМЕНЕНИЕ: Добавили type="submit" -->
                <button type="submit">Sign In</button>
            </form>
        </div>

        <!-- Декоративная панель (Overlay) -->
        <div class="overlay-container">
            <div class="overlay">
                <div class="overlay-panel overlay-left">
                    <h1>Welcome Back!</h1>
                    <p>To keep connected with us please login with your personal info</p>
                    <button class="ghost" id="signIn">Sign In</button>
                </div>
                <div class="overlay-panel overlay-right">
                    <h1>Hello, Friend!</h1>
                    <p>Enter your personal details and start your journey with us</p>
                    <button class="ghost" id="signUp">Sign Up</button>
                </div>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
